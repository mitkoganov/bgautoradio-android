<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no,width=device-width"/>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
  #map { position:fixed; top:0; left:0; right:0; bottom:0; }
</style>
<link href="maplibre-gl.css" rel="stylesheet"/>
<script src="maplibre-gl.js"></script>
</head>
<body>
<div id="map"></div>
<script>
var apiKey = (typeof Android !== 'undefined') ? Android.getApiKey() : '';

var map = new maplibregl.Map({
  container:         'map',
  style:             'https://assets.vector.hereapi.com/styles/berlin/base/mapbox/tilezen?apikey=' + apiKey,
  center:            [23.3219, 42.6977],
  zoom:              15,
  pitch:             0,
  bearing:           0,
  attributionControl: false
});

window.addEventListener('resize', function() { map.resize(); });

map.on('load', function() {
  /* ── Navigation arrow sprite (drawn on canvas, aligned to map surface) ── */
  var size = 96;
  var canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  var ctx = canvas.getContext('2d');
  ctx.beginPath();
  ctx.arc(size/2, size/2, size/2 - 2, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,188,212,0.20)';
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(size/2, 10);
  ctx.lineTo(size/2 + 18, size - 14);
  ctx.lineTo(size/2, size - 24);
  ctx.lineTo(size/2 - 18, size - 14);
  ctx.closePath();
  ctx.fillStyle = '#00BCD4';
  ctx.strokeStyle = 'white';
  ctx.lineWidth = 3;
  ctx.lineJoin = 'round';
  ctx.fill();
  ctx.stroke();
  map.addImage('nav-arrow', ctx.getImageData(0, 0, size, size));

  map.addSource('loc', {
    type: 'geojson',
    data: { type: 'Feature', geometry: { type: 'Point', coordinates: [0, 0] }, properties: { bearing: 0 } }
  });
  map.addLayer({
    id: 'loc-arrow',
    type: 'symbol',
    source: 'loc',
    layout: {
      'icon-image':              'nav-arrow',
      'icon-size':               0.6,
      'icon-rotation-alignment': 'map',
      'icon-pitch-alignment':    'map',
      'icon-rotate':             ['get', 'bearing'],
      'icon-allow-overlap':      true,
    }
  });

  if (typeof Android !== 'undefined') Android.onMapReady();
});

/* ── Camera ── */
window.updateCamera = function(lat, lng, zoom, pitch, bearing, animated) {
  var opts = { center: [lng, lat], zoom: zoom, pitch: pitch, bearing: bearing };
  if (animated) map.easeTo(Object.assign(opts, { duration: 500 }));
  else          map.jumpTo(opts);
};

/* ── Route ── */
function removeRoute() {
  if (map.getLayer('route-line'))   map.removeLayer('route-line');
  if (map.getLayer('route-shadow')) map.removeLayer('route-shadow');
  if (map.getSource('route'))       map.removeSource('route');
}

window.setRoute = function(json) {
  try {
    removeRoute();
    var coords = JSON.parse(json).map(function(p) { return [p[1], p[0]]; });
    console.log('setRoute: ' + coords.length + ' points, first=' + JSON.stringify(coords[0]));
    if (coords.length < 2) return;
    map.addSource('route', {
      type: 'geojson',
      data: { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } }
    });
    map.addLayer({ id: 'route-shadow', type: 'line', source: 'route',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint:  { 'line-color': 'rgba(0,0,0,0.45)', 'line-width': 14 } }, 'loc-arrow');
    map.addLayer({ id: 'route-line', type: 'line', source: 'route',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint:  { 'line-color': '#4A90E2', 'line-width': 9 } }, 'loc-arrow');
    console.log('setRoute: OK layers=' + !!map.getLayer('route-line'));
  } catch(e) {
    console.log('setRoute ERROR: ' + e.message);
  }
};

/* ── Destination marker ── */
var destMarker = null;
window.setDestination = function(lat, lng) {
  if (destMarker) { destMarker.remove(); destMarker = null; }
  if (lat === null || lng === null) return;
  var el = document.createElement('div');
  el.innerHTML = '<svg width="24" height="24" xmlns="http://www.w3.org/2000/svg">' +
    '<circle cx="12" cy="12" r="10" fill="#FF5252" stroke="white" stroke-width="2.5"/></svg>';
  destMarker = new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat([lng, lat]).addTo(map);
};

/* ── Current location ── */
window.setCurrentLocation = function(lat, lng, bearing) {
  if (lat === null || lng === null) return;
  var src = map.getSource('loc');
  if (!src) return;
  src.setData({
    type: 'Feature',
    geometry:   { type: 'Point', coordinates: [lng, lat] },
    properties: { bearing: bearing || 0 }
  });
};
</script>
</body>
</html>
