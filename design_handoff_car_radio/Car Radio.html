<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Car Radio — Bulgaria · Android Head Unit</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-0: #03070d;
    --bg-1: #08111e;
    --bg-2: #0b1828;
    --panel: rgba(255,255,255,0.045);
    --panel-2: rgba(255,255,255,0.07);
    --panel-3: rgba(255,255,255,0.10);
    --border: rgba(255,255,255,0.08);
    --border-2: rgba(255,255,255,0.18);
    --text: #E8EFF8;
    --text-2: #98A8BF;
    --text-3: #5D6E87;
    --text-4: #3F4F66;
    --accent: #4DD3FF;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background: #000; overflow:hidden; font-family:"Sora", system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input { font-family: inherit; }

  /* ───── Stage scaling ───── */
  .stage-host { position: fixed; inset: 0; background: #000; overflow: hidden; }
  .stage {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 720px;
    transform-origin: 0 0;
    background: var(--bg-0);
  }

  /* ───── Root + background ───── */
  .hu-root { position: relative; width: 1920px; height: 720px; overflow: hidden; }
  .bg-base {
    position:absolute; inset:0;
    background:
      radial-gradient(120% 70% at 50% -10%, #0e2440 0%, #050a14 55%, #02060c 100%),
      linear-gradient(180deg, #050a14, #02060c);
  }
  .bg-grain {
    position:absolute; inset:0; pointer-events:none; opacity:0.4;
    background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 3px 3px;
    mask-image: radial-gradient(80% 60% at 50% 60%, #000 0%, transparent 80%);
  }
  .bg-glow { position:absolute; inset:0; pointer-events:none; }

  /* ───── Top bar — angled chrome (matches reference) ───── */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 6;
    height: 66px;
    pointer-events: none;
  }
  .tb-chrome {
    position: absolute; top: 0; height: 66px;
    display: flex; align-items: center; gap: 0;
    pointer-events: auto;
    background: linear-gradient(180deg, rgba(8,16,28,0.96) 0%, rgba(8,16,28,0.78) 100%);
    border-bottom: 1px solid rgba(120,170,255,0.18);
  }
  .tb-chrome-left {
    left: 0; padding: 0 22px 0 0;
    clip-path: polygon(0 0, 100% 0, calc(100% - 32px) 100%, 0 100%);
    width: 350px;
  }
  .tb-chrome-right {
    right: 0; padding: 0 0 0 22px; justify-content: flex-end;
    clip-path: polygon(32px 0, 100% 0, 100% 100%, 0 100%);
    width: 220px;
  }
  /* Cyan accent line that traces the chamfered edge */
  .tb-chrome::after {
    content:""; position:absolute; bottom: -1px; width: 60px; height: 2px;
    background: linear-gradient(90deg, transparent, #5fb6ff);
    box-shadow: 0 0 10px #5fb6ff99;
    pointer-events: none;
  }
  .tb-chrome-left::after  { right: 12px; transform: skewX(45deg) translateX(8px); }
  .tb-chrome-right::after { left: 12px; transform: skewX(-45deg) translateX(-8px); background: linear-gradient(270deg, transparent, #5fb6ff); }

  .tb-home, .tb-cog {
    width: 64px; height: 66px;
    display:flex; align-items:center; justify-content:center;
    color: #fff; transition: color .15s;
    padding-left: 18px;
  }
  .tb-cog { padding-left: 0; padding-right: 22px; }
  .tb-home:hover, .tb-cog:hover { color: #5fb6ff; }
  .tb-channels {
    display:flex; align-items:center; gap: 14px;
    padding: 0 18px; height: 66px;
    color: #fff; font-size: 22px; font-weight: 400; letter-spacing: 0.3px;
    transition: color .15s;
  }
  .tb-channels:hover { color: #5fb6ff; }
  .tb-channels.is-on { color: #5fb6ff; }
  .tb-clock { font-size: 26px; font-weight: 500; color: #fff; font-variant-numeric: tabular-nums; padding-right: 14px; letter-spacing: 0.5px; }

  /* ───── Body / rail / main ───── */
  .body { position: relative; display:flex; height: 720px; }
  .body.has-rail { padding-top: 66px; height: 720px; }
  .body.has-rail .main { height: calc(720px - 66px); }
  .rail {
    width: 110px; flex-shrink:0; margin-top: 0;
    display:flex; flex-direction:column; gap: 6px; padding: 14px 8px;
    background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.005));
    border-right: 1px solid var(--border);
  }
  .rail-item {
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding: 10px 6px; border-radius: 14px;
    color: var(--text-3); transition: all .15s; position: relative;
  }
  .rail-item:hover { color: var(--text-2); background: rgba(255,255,255,0.03); }
  .rail-item.is-active { color: var(--text); background: rgba(255,255,255,0.05); }
  .rail-item.is-active::before {
    content:""; position:absolute; left:0; top:14px; bottom:14px; width:3px;
    background: currentColor; border-radius: 0 2px 2px 0;
    box-shadow: 0 0 12px currentColor;
  }
  .rail-icon-wrap { display:flex; align-items:center; justify-content:center; width:44px; height:44px; }
  .rail-label { font-size: 11px; font-weight: 600; letter-spacing: 0.3px; }
  .main { flex:1; position: relative; overflow: hidden; }

  /* ───── Equalizer / spectrum ───── */
  .eq-row { display:inline-flex; align-items:flex-end; gap: 3px; height: 28px; }
  .eq-bar { width: 3px; min-height: 2px; border-radius:1px; animation: eq-bounce 0.7s ease-in-out infinite alternate; }
  .eq-bar.paused { animation-play-state: paused; height: 30%; opacity: 0.35; }
  @keyframes eq-bounce {
    0%   { height: 18%; }
    50%  { height: 65%; }
    100% { height: 100%; }
  }
  .spectrum { display:flex; align-items:flex-end; gap:2px; height: 72px; padding-top: 8px; }
  .spec-bar { flex:1; min-height:4px; border-radius:1px; animation: spec-bounce 0.9s ease-in-out infinite alternate; }
  .spec-bar.paused { animation-play-state: paused; height: 14%; opacity:0.3; }
  @keyframes spec-bounce {
    0% { height: 8%; }
    50% { height: 55%; }
    100% { height: 100%; }
  }

  /* ───── Now Playing (reference layout) ───── */
  .now-ref { position: relative; width: 100%; height: 720px; overflow: hidden; }
  .now-spot { position: absolute; inset: 0; pointer-events: none; }
  .now-floor {
    position: absolute; left: 0; right: 0; bottom: 0; height: 58%;
    background:
      radial-gradient(50% 80% at 50% 0%, rgba(95,182,255,0.18) 0%, transparent 70%),
      radial-gradient(60% 100% at 50% 100%, rgba(0,0,0,0.6) 0%, transparent 70%);
    pointer-events: none;
  }
  .now-floor-fade {
    position: absolute; left: 0; right: 0; bottom: 0; height: 50%;
    background-image: radial-gradient(rgba(180,210,255,0.22) 1px, transparent 1.2px);
    background-size: 14px 14px;
    mask-image: linear-gradient(180deg, transparent 0%, #000 35%, #000 70%, transparent 100%);
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 35%, #000 70%, transparent 100%);
    transform: perspective(800px) rotateX(64deg);
    transform-origin: top center;
    opacity: 0.7;
    pointer-events: none;
  }

  .now-stage {
    position: relative; width: 100%; height: 100%;
    display: grid; grid-template-columns: 1fr 1.05fr;
    gap: 60px; padding: 110px 120px 0 220px;
    align-items: start;
  }
  .ref-cover-wrap { display:flex; flex-direction:column; align-items:flex-end; }
  .ref-cover {
    position: relative;
    width: 320px; height: 320px;
    border: 2px solid rgba(220,230,245,0.85);
    overflow: hidden;
    background: #0b1830;
    box-shadow:
      0 30px 80px rgba(0,0,0,0.7),
      0 0 0 1px rgba(255,255,255,0.04) inset,
      0 0 60px rgba(95,182,255,0.18);
  }
  .ref-cover-inner { width:100%; height:100%; }
  .ref-cover-inner svg { width:100%; height:100%; }
  .ref-cover-sheen {
    position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(160deg, rgba(255,255,255,0.18) 0%, transparent 30%, transparent 70%, rgba(255,255,255,0.05) 100%);
  }
  .ref-cover-reflect {
    margin-top: 2px;
    width: 320px; height: 200px; overflow: hidden;
    mask-image: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, transparent 90%);
    -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, transparent 90%);
  }
  .ref-cover.ref-mirror { transform: scaleY(-1); box-shadow: none; border-color: rgba(220,230,245,0.4); }

  .ref-meta {
    display: flex; flex-direction: column; gap: 28px;
    padding-top: 56px;
    color: #ffffff;
    min-width: 0;
  }
  .ref-line { display:flex; align-items:center; gap: 18px; color: #ffffff; }
  .ref-line-sub { gap: 18px; }
  .ref-name { font-size: 44px; font-weight: 500; letter-spacing: 1.5px; }
  .ref-song { font-size: 32px; font-weight: 400; letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ref-artist { font-size: 24px; font-weight: 400; color: rgba(255,255,255,0.7); letter-spacing: 0.5px; }

  .ref-freq {
    position: absolute; right: 120px; top: 170px;
    text-align: left; line-height: 1.25;
  }
  .ref-freq-num { font-size: 20px; font-weight: 500; color: #ffffff; letter-spacing: 0.5px; }
  .ref-freq-city { font-size: 16px; color: rgba(255,255,255,0.7); font-weight: 400; }

  /* Slim transport at the very bottom — sits over the reflective floor */
  .ref-transport {
    position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
    display:flex; align-items:center; gap: 12px;
    padding: 10px 18px;
    background: rgba(8, 16, 28, 0.72);
    border: 1px solid rgba(120,170,255,0.18);
    border-radius: 999px;
    backdrop-filter: blur(20px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    z-index: 5;
  }
  .rt-btn {
    width: 42px; height: 42px; border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    color: #cfd9e9; transition: all .15s;
  }
  .rt-btn:hover { background: rgba(255,255,255,0.07); color: #fff; }
  .rt-play {
    width: 50px; height: 50px; border-radius: 50%;
    border: 2px solid;
    display:flex; align-items:center; justify-content:center;
    background: rgba(77,211,255,0.08);
    transition: all .15s;
  }
  .rt-play:hover { background: rgba(77,211,255,0.18); transform: scale(1.05); }
  .rt-spacer { width: 1px; height: 24px; background: rgba(255,255,255,0.12); }
  .rt-vol { display:flex; align-items:center; gap: 10px; padding: 0 10px; color: #cfd9e9; }
  .rt-vol-track { width: 120px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.12); position: relative; cursor: pointer; }
  .rt-vol-fill { height: 100%; border-radius: 2px; }
  .rt-eq { padding: 0 8px; }
  .now-cover-col { position: relative; padding-top: 16px; }
  .cover-frame {
    width: 360px; height: 360px; border-radius: 22px;
    border: 2px solid rgba(255,255,255,0.55);
    overflow: hidden; position: relative;
    background: #0d1828;
    box-shadow:
      0 30px 60px rgba(0,0,0,0.55),
      0 0 0 1px rgba(255,255,255,0.04) inset;
  }
  .cover-art { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  .cover-art svg { width:100%; height:100%; }
  .cover-shine {
    position:absolute; inset:0;
    background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, transparent 35%, transparent 65%, rgba(255,255,255,0.06) 100%);
    pointer-events:none;
  }
  .cover-reflect {
    margin-top: 6px;
    height: 110px; overflow: hidden;
    mask-image: linear-gradient(180deg, rgba(0,0,0,0.4), transparent);
    -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.4), transparent);
  }
  .cover-frame.mirror { transform: scaleY(-1); box-shadow: none; opacity: 0.7; }

  .now-meta-col { display:flex; flex-direction:column; padding-top: 28px; min-width: 0; }
  .meta-row { display:flex; align-items:center; gap:14px; margin-bottom: 18px; }
  .meta-station { font-size: 40px; font-weight: 700; letter-spacing: 1.5px; }
  .meta-live {
    display:flex; align-items:center; gap:6px;
    font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(255,93,122,0.14); color: #ff7d8f;
    border: 1px solid rgba(255,93,122,0.3);
  }
  .live-dot { width:6px; height:6px; border-radius:50%; background:#ff5d7a; box-shadow: 0 0 8px #ff5d7a; animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity:0.4; } }
  .meta-track { display:flex; align-items:center; gap:12px; font-size: 26px; font-weight: 500; margin-bottom: 10px; color: var(--text); }
  .meta-track span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta-artist { display:flex; align-items:center; gap:12px; font-size: 20px; color: var(--text-2); margin-bottom: 4px; }
  .meta-album { font-size: 14px; color: var(--text-3); margin-left: 32px; margin-bottom: 28px; }
  .progress-row { display:flex; align-items:center; gap:14px; margin-bottom: 22px; max-width: 720px; }
  .time-cur, .time-tot { font-size: 14px; color: var(--text-2); font-variant-numeric: tabular-nums; min-width: 44px; }
  .time-tot { color: var(--text-3); text-align: right; }
  .progress-track {
    flex: 1; height: 6px; border-radius: 3px;
    background: rgba(255,255,255,0.08); position: relative; cursor: pointer;
  }
  .progress-fill { height: 100%; border-radius: 3px; }
  .progress-knob {
    position: absolute; top: -5px; width: 16px; height: 16px; border-radius: 50%;
  }
  .transport-row { display:flex; align-items:center; gap: 14px; }
  .t-btn {
    width: 60px; height: 60px; border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    color: var(--text); transition: all .15s;
  }
  .t-btn:hover { background: var(--panel-2); }
  .t-btn.t-secondary { width: 48px; height: 48px; color: var(--text-2); }
  .t-btn.t-play { width: 80px; height: 80px; color: #03070d; border: none; }
  .t-btn.t-play:hover { transform: scale(1.04); }
  .t-btn.is-active { color: #ff5d7a; }

  .now-info-col { display:flex; flex-direction:column; gap: 16px; padding-top: 16px; }
  .freq-card {
    position: relative; padding: 18px 22px;
    background: linear-gradient(180deg, rgba(77,211,255,0.08), rgba(77,211,255,0.02));
    border: 1px solid rgba(77,211,255,0.25); border-radius: 18px;
  }
  .freq-num {
    font-size: 78px; font-weight: 300; line-height: 1; letter-spacing: -2px;
    font-variant-numeric: tabular-nums; color: var(--text);
    display: inline-block;
  }
  .freq-suffix { font-size: 22px; font-weight: 500; margin-left: 8px; color: var(--accent); vertical-align: top; line-height: 28px; }
  .freq-city { font-size: 13px; color: var(--text-2); margin-top: 4px; letter-spacing: 1px; }
  .info-card {
    padding: 14px 18px; border-radius: 18px;
    background: var(--panel); border: 1px solid var(--border);
  }
  .info-row { display:flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
  .info-key { color: var(--text-3); }
  .info-val { color: var(--text); font-weight: 500; }
  .info-spectrum { margin-top: 10px; height: 56px; }
  .info-spectrum .spectrum { height: 56px; }

  .vol-row { display:flex; align-items:center; gap: 14px; padding: 10px 18px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px; }
  .vol-track { flex:1; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); position:relative; cursor:pointer; }
  .vol-fill { height:100%; border-radius:3px; }
  .vol-knob { position:absolute; top:-4px; width:14px; height:14px; border-radius:50%; }
  .vol-val { font-size: 14px; color: var(--text-2); font-variant-numeric: tabular-nums; min-width: 24px; text-align: right; }

  /* ───── Generic screens ───── */
  .screen { padding: 28px 48px 100px; height: 100%; overflow-y: auto; overflow-x: hidden; }
  .screen-head { display:flex; align-items:flex-end; justify-content: space-between; margin-bottom: 22px; }
  .screen-title { font-size: 36px; font-weight: 700; letter-spacing: -0.5px; margin: 0; }
  .screen-sub { font-size: 14px; color: var(--text-3); margin: 4px 0 0; }
  .head-actions { display:flex; gap: 10px; }
  .pill-btn {
    display:flex; align-items:center; gap:8px; padding: 10px 16px;
    border-radius: 999px; background: var(--panel); border: 1px solid var(--border);
    font-size: 14px; font-weight: 500; color: var(--text-2); transition: all .15s;
  }
  .pill-btn:hover { background: var(--panel-2); color: var(--text); }
  .pill-primary { background: rgba(77,211,255,0.06); }

  .card-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .station-card {
    display:flex; gap: 16px; align-items: center;
    padding: 14px; border-radius: 16px; text-align: left;
    background: var(--panel); border: 1px solid var(--border);
    transition: all .15s; position: relative; overflow: hidden;
  }
  .station-card:hover { background: var(--panel-2); border-color: var(--border-2); transform: translateY(-1px); }
  .station-card.is-active { background: rgba(77,211,255,0.07); border-color: rgba(77,211,255,0.5); }
  .station-card.is-active::before {
    content:""; position:absolute; left:0; top:0; bottom:0; width: 3px; background: var(--accent);
  }
  .sc-cover { flex-shrink:0; width: 80px; height: 80px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.18); }
  .sc-cover svg { width:100%; height:100%; }
  .sc-meta { flex:1; min-width: 0; }
  .sc-name { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .sc-genre { font-size: 12px; color: var(--text-2); margin-bottom: 2px; }
  .sc-freq { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .sc-side { display:flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .sc-onair { display:flex; flex-direction: column; align-items: flex-end; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
  .sc-play-hint { opacity: 0.7; }
  .sc-fav { display:flex; padding: 4px; }

  .empty { text-align:center; padding: 80px 20px; color: var(--text-2); }
  .empty p { margin-top: 18px; font-size: 16px; line-height: 1.6; }

  /* Categories chips */
  .cat-row { display:flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
  .cat-chip {
    display:flex; align-items:center; gap:10px; padding: 10px 16px;
    border-radius: 999px; background: var(--panel); border: 1px solid var(--border);
    color: var(--text-2); font-size: 14px; font-weight: 500; transition: all .15s;
  }
  .cat-chip:hover:not(:disabled) { background: var(--panel-2); color: var(--text); }
  .cat-chip:disabled { opacity: 0.35; cursor: not-allowed; }
  .chip-name { font-size: 14px; }
  .chip-count {
    font-size: 11px; color: var(--text-3);
    background: rgba(255,255,255,0.06); padding: 2px 8px; border-radius: 10px;
  }

  /* Search */
  .search-bar {
    display:flex; align-items: center; gap: 14px; padding: 16px 22px;
    background: var(--panel-2); border: 1px solid var(--border-2); border-radius: 16px;
    margin-bottom: 22px;
  }
  .search-bar input {
    flex:1; background: transparent; border: none; outline: none;
    color: var(--text); font-size: 20px; font-weight: 400;
  }
  .search-bar input::placeholder { color: var(--text-3); }
  .search-clear { padding: 6px; color: var(--text-3); border-radius: 6px; }
  .search-clear:hover { color: var(--text); background: rgba(255,255,255,0.05); }
  .search-suggest { margin-top: 6px; }
  .suggest-label { font-size: 12px; color: var(--text-3); margin-bottom: 10px; letter-spacing: 2px; text-transform: uppercase; }
  .suggest-chips { display:flex; gap: 10px; flex-wrap: wrap; }

  /* Recent */
  .recent-list { display:flex; flex-direction: column; gap: 8px; }
  .recent-row {
    display:flex; align-items: center; gap: 18px; padding: 12px 18px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    text-align: left; transition: all .15s;
  }
  .recent-row:hover { background: var(--panel-2); }
  .rr-time { font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; min-width: 50px; }
  .rr-cover { width: 56px; height: 56px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); flex-shrink:0; }
  .rr-cover svg { width:100%; height:100%; }
  .rr-meta { flex:1; min-width: 0; }
  .rr-station { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
  .rr-freq { font-size: 12px; color: var(--text-3); font-weight: 400; margin-left: 6px; }
  .rr-track { font-size: 13px; color: var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rr-side { display:flex; align-items: center; }
  .rr-play { display:flex; }

  /* Settings */
  .settings-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .settings-card { padding: 18px 22px; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; }
  .settings-head { display:flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .settings-title { font-size: 18px; font-weight: 600; }
  .settings-en { font-size: 11px; color: var(--text-3); letter-spacing: 2px; text-transform: uppercase; }
  .settings-rows { display:flex; flex-direction: column; }
  .settings-row { display:flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .settings-row:last-child { border-bottom: none; }
  .sr-label { font-size: 14px; color: var(--text); }
  .sr-val { display:flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-2); }
  .tog {
    width: 44px; height: 24px; border-radius: 999px;
    background: rgba(255,255,255,0.10); position:relative; transition: background .15s;
  }
  .tog-knob { position:absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #e8eff8; transition: transform .15s; }
  .tog.on .tog-knob { transform: translateX(20px); background: #03070d; }

  /* Mini player */
  .mini-player {
    position: absolute; right: 24px; bottom: 16px; left: 24px;
    height: 76px; display:flex; align-items: center; gap: 16px;
    padding: 8px 14px 8px 8px;
    background: rgba(8, 16, 28, 0.85); backdrop-filter: blur(24px);
    border: 1px solid var(--border-2); border-radius: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    z-index: 10;
  }
  .mp-cover { width: 60px; height: 60px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); flex-shrink: 0; }
  .mp-cover svg { width:100%; height:100%; }
  .mp-meta { flex:1; min-width: 0; }
  .mp-station { font-size: 14px; font-weight: 600; }
  .mp-freq { color: var(--text-3); font-weight: 400; font-size: 12px; }
  .mp-track { font-size: 12px; color: var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mp-eq { padding: 0 10px; }
  .mp-controls { display:flex; align-items: center; gap: 6px; }
  .mp-btn { width: 44px; height: 44px; border-radius: 10px; background: rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:center; color: var(--text); }
  .mp-btn:hover { background: var(--panel-2); }
  .mp-btn.mp-play { color: #03070d; }
  .mp-btn.mp-play:hover { transform: scale(1.04); }

  /* Tweaks station list */
  .tweak-stations { display:flex; flex-direction: column; gap: 4px; }
  .tw-stat {
    display:flex; align-items:center; gap: 10px;
    padding: 8px 10px; border-radius: 8px;
    background: rgba(255,255,255,0.03); border: 1px solid transparent;
    color: var(--text); font-size: 13px; text-align: left; transition: all .15s;
  }
  .tw-stat:hover { background: rgba(255,255,255,0.06); }
  .tw-stat.is-on { background: rgba(77,211,255,0.10); }
  .tw-stat-mark { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; }
  .tw-stat-freq { margin-left: auto; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }

  /* Custom scrollbar */
  .screen::-webkit-scrollbar { width: 6px; }
  .screen::-webkit-scrollbar-track { background: transparent; }
  .screen::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
</style>
